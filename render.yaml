services:
  - type: web
    name: foot-predict
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: FOOTBALL_DATA_KEY   # clé gratuite de football-data.org
        sync: false
      - key: POLL_SECONDS
        value: "300"
      # Accès Premium
      - key: ACCESS_SECRET   # secret de signature des codes : à coller dans Render, ne jamais le changer ni le partager
        sync: false
      - key: ADMIN_KEY       # clé pour créer des codes : /admin/code?key=...&plan=semaine (ou mois)
        sync: false
      - key: WAVE_URL        # lien Wave de base ; les montants 3800 et 12000 sont ajoutés par l'application
        value: "https://pay.wave.com/m/M_ci_fAtDWzspJqhS/c/ci/"
      - key: WHATSAPP_NUMBER # numéro qui reçoit les preuves de paiement (format international, ex. 225XXXXXXXXXX)
        sync: false
      # Analyses rédigées par Claude (facultatif : sans clé, le modèle rédige une analyse automatique)
      - key: ANTHROPIC_API_KEY
        sync: false
