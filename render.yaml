services:
  - type: web
    name: foot-predict
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: FOOTBALL_API_KEY
        sync: false
      - key: POLL_SECONDS
        value: "1200"
